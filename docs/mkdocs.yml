site_name: EDAC Documentation
site_description: Event-Driven Agentic Core — API reference and developer guide
site_author: EDAC Team
docs_dir: .

repo_name: edac-team/edac
repo_url: https://github.com/edac-team/edac

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - SDK: sdk.md
  - API Reference: api.md
  - Observability: observability.md
  - Contributing: contributing.md

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/edac-team/edac

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

plugins:
  - search

copyright: Copyright &copy; 2026 EDAC Team. MIT License.
