[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edac"
version = "0.3.0"
description = "Event-Driven Agentic Core — A comprehensive SDK for building agentic systems"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "EDAC Team"},
]
keywords = ["agent", "llm", "event-driven", "mcp", "a2a", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "anyio>=4.0",
    "structlog>=24.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "click>=8.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "aiohttp>=3.9",
    "tenacity>=8.0",
]

[project.optional-dependencies]
stream = ["websockets>=12.0"]
anthropic = ["anthropic>=0.25"]
openai = ["openai>=1.0"]
local = ["transformers>=4.40", "torch>=2.0"]
mcp = ["mcp>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
all = [
    "anthropic>=0.25",
    "openai>=1.0",
    "transformers>=4.40",
    "torch>=2.0",
    "mcp>=1.0",
]

[project.scripts]
edac = "edac.cli.main:main"

[project.urls]
Homepage = "https://github.com/edac-team/edac"
Documentation = "https://edac-team.github.io/edac"
Repository = "https://github.com/edac-team/edac.git"
Issues = "https://github.com/edac-team/edac/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["edac*"]

[tool.setuptools.package-data]
edac = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["edac"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
